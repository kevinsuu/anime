name: Deploy

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: kevinsuu

permissions: {}

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match v<major>.<minor>.<patch>." >&2
            exit 1
          fi

  build-and-push:
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # GHCR and the GHA cache share GitHub-side secondary rate limits. Push
      # each image sequentially so three cache exports and six image tags do
      # not create a burst of concurrent write requests.
      max-parallel: 1
      matrix:
        include:
          - image: anime-backend
            context: backend
            file: backend/Dockerfile.production
            scope: backend
          - image: anime-scheduler
            context: backend
            file: backend/Dockerfile.scheduler
            scope: scheduler
          - image: anime-frontend
            context: frontend
            file: frontend/Dockerfile
            scope: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        if: matrix.image != 'anime-frontend'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          pull: true
          push: true
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:latest

      - name: Build and push frontend
        if: matrix.image == 'anime-frontend'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}
          build-args: |
            NUXT_PUBLIC_API_BASE_URL=https://anime.kaistarstudio.me/api
            NUXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NUXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NUXT_PUBLIC_APP_VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Encode deployment compose file
        shell: bash
        run: |
          {
            echo 'COMPOSE_B64<<EOF'
            base64 -w 0 deploy/docker-compose.yml
            echo
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_TAG: ${{ github.ref_name }}
          COMPOSE_B64: ${{ env.COMPOSE_B64 }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Sequential image pulls with retries can exceed the default timeout
          # on a busy or bandwidth-limited host.
          command_timeout: 60m
          envs: DEPLOY_PATH,RELEASE_TAG,COMPOSE_B64
          script: |
            set -e
            # Pasted secrets may retain CR/LF and turn an otherwise valid path
            # into a different directory name on the remote host.
            DEPLOY_PATH="$(printf '%s' "${DEPLOY_PATH:-}" | tr -d '\r\n')"
            if [ -z "$DEPLOY_PATH" ]; then
              echo "DEPLOY_PATH is empty after removing line breaks." >&2
              exit 1
            fi
            case "$DEPLOY_PATH" in
              /*) ;;
              *) echo "DEPLOY_PATH must be an absolute path." >&2; exit 1 ;;
            esac
            cd -- "$DEPLOY_PATH"
            cleanup_unused_images() {
              echo "Removing unused Docker images created more than 7 days ago..."
              if ! docker image prune -a -f --filter "until=168h"; then
                echo "Warning: failed to prune unused Docker images." >&2
              fi
            }
            # Read the release tag currently recorded in .env (the version that
            # is running before this deploy), e.g. BACKEND_IMAGE=...:v1.0.39.
            image_tag_from_env() {
              sed -n "s|^$1=.*:||p" .env 2>/dev/null | tail -n 1 | tr -d '\r'
            }
            # Keep only this release and the previous one for each app image,
            # so a rollback stays possible while older releases cannot fill
            # the disk. Runs before the pull as well: a full disk otherwise
            # fails the pull and the post-deploy cleanup never gets to run.
            # Volumes (MySQL data, cover thumbnails) are never touched.
            prune_old_release_images() {
              for spec in \
                "anime-backend:${PREVIOUS_BACKEND_TAG}" \
                "anime-scheduler:${PREVIOUS_SCHEDULER_TAG}" \
                "anime-frontend:${PREVIOUS_FRONTEND_TAG}"; do
                repo="ghcr.io/kevinsuu/${spec%%:*}"
                previous="${spec#*:}"
                for tag in $(docker image ls "$repo" --format '{{.Tag}}'); do
                  case "$tag" in
                    "<none>"|latest|"$RELEASE_TAG"|"$previous") continue ;;
                  esac
                  echo "Removing old release image ${repo}:${tag}"
                  docker image rm "${repo}:${tag}" > /dev/null \
                    || echo "Warning: could not remove ${repo}:${tag}" >&2
                done
              done
              docker image prune -f > /dev/null \
                || echo "Warning: failed to prune dangling images." >&2
              docker builder prune -a -f > /dev/null \
                || echo "Warning: failed to prune build cache." >&2
            }
            if [ -z "${COMPOSE_B64:-}" ]; then
              echo "Encoded docker-compose.yml is empty." >&2
              exit 1
            fi
            if ! printf '%s' "$COMPOSE_B64" | base64 -d > docker-compose.yml.tmp; then
              rm -f docker-compose.yml.tmp
              echo "Failed to decode docker-compose.yml." >&2
              exit 1
            fi
            mv docker-compose.yml.tmp docker-compose.yml
            touch .env
            PREVIOUS_BACKEND_TAG="$(image_tag_from_env BACKEND_IMAGE)"
            PREVIOUS_SCHEDULER_TAG="$(image_tag_from_env SCHEDULER_IMAGE)"
            PREVIOUS_FRONTEND_TAG="$(image_tag_from_env FRONTEND_IMAGE)"
            echo "Freeing disk space before pulling ${RELEASE_TAG}..."
            df -h / || true
            prune_old_release_images || echo "Warning: pre-pull image cleanup failed." >&2
            set_env_var() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              else
                echo "${key}=${value}" >> .env
              fi
            }
            set_env_var BACKEND_IMAGE "ghcr.io/kevinsuu/anime-backend:${RELEASE_TAG}"
            set_env_var SCHEDULER_IMAGE "ghcr.io/kevinsuu/anime-scheduler:${RELEASE_TAG}"
            set_env_var FRONTEND_IMAGE "ghcr.io/kevinsuu/anime-frontend:${RELEASE_TAG}"
            pull_attempt=1
            max_pull_attempts=5
            while true; do
              echo "Pulling production images (attempt ${pull_attempt}/${max_pull_attempts})..."
              if docker compose --parallel 1 pull; then
                break
              fi
              if [ "$pull_attempt" -ge "$max_pull_attempts" ]; then
                echo "Failed to pull production images after ${max_pull_attempts} attempts." >&2
                exit 1
              fi
              retry_delay=$((pull_attempt * 15))
              echo "Image pull failed; retrying in ${retry_delay}s." >&2
              sleep "$retry_delay"
              pull_attempt=$((pull_attempt + 1))
            done
            docker compose up -d --remove-orphans
            prune_old_release_images || echo "Warning: post-deploy image cleanup failed." >&2
            cleanup_unused_images
            df -h / || true
